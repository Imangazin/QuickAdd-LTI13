<!--
Paste this fragment into the custom widget's HTML source editor.
Add your title and explanatory text separately in the editor.

Replace REPLACE_WITH_BRIGHTSPACE_QUICKLINK below with the URL generated by
Brightspace's Insert Quicklink > External Learning Tools > QuickAdd.
Use the Brightspace launch link, NOT your server's /launch/ or /login/ URL.
Configure that link to open in the same frame, rather than a new window.
For a shared widget, retain Brightspace's {orgUnitId} substitution in the
Quicklink's course ID parameter instead of hardcoding one course's ID.

The widget must permit JavaScript. QuickAdd and its login flow must permit
embedding in Brightspace. Adjust the iframe height below if needed.
-->
<div id="quickadd-widget" class="quickadd-widget" data-quickadd-widget>
  <button type="button" data-quickadd-open
    style="display:block;width:250px;max-width:100%;min-height:42px;margin:16px auto;border:0;border-radius:6px;padding:10px 20px;background:#e3e9f2;color:#202122;font:inherit;font-weight:600;cursor:pointer;">
    Add user
  </button>
  <p data-quickadd-status role="status" style="text-align:center;"></p>
  <div data-quickadd-content></div>
</div>
<script>
(function () {
  "use strict";

  var launchUrl = "REPLACE_WITH_BRIGHTSPACE_QUICKLINK";
  function initializeQuickAdd() {
    var widget = document.getElementById("quickadd-widget");
    if (!widget || widget.getAttribute("data-initialized") === "true") return;
    var button = widget.querySelector("[data-quickadd-open]");
    var status = widget.querySelector("[data-quickadd-status]");
    var content = widget.querySelector("[data-quickadd-content]");
    if (!button || !status || !content) return;
    widget.setAttribute("data-initialized", "true");
    var started = false;

    button.addEventListener("click", function () {
      if (started) return;
      if (launchUrl === "REPLACE_WITH_BRIGHTSPACE_QUICKLINK") {
        status.textContent = "Set the QuickAdd Brightspace Quicklink in the widget HTML first.";
        return;
      }

      var url;
      try {
        url = new URL(launchUrl, window.location.href);
        if (url.protocol !== "https:") throw new Error("HTTPS required");
      } catch (error) {
        status.textContent = "The QuickAdd launch link must be a valid HTTPS URL.";
        return;
      }

      started = true;
      button.remove();
      status.textContent = "Opening QuickAdd…";

      var frame = document.createElement("iframe");
      frame.title = "QuickAdd — Add user";
      frame.style.cssText = "display:block;width:100%;height:460px;border:0;";
      frame.addEventListener("load", function () {
        // A frame load does not prove that the LTI launch succeeded.
        // The tool or Brightspace displays its own response inside the frame.
        status.textContent = "";
      });
      frame.src = url.href;
      content.appendChild(frame);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeQuickAdd, { once: true });
  } else {
    initializeQuickAdd();
  }
})();
</script>
